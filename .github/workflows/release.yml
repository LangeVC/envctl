name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Create release tarball
        run: |
          tar -czf envctl-${{ steps.version.outputs.VERSION }}.tar.gz \
            bin/envctl install.sh Formula/ examples/ LICENSE README.md
      - name: Compute SHA256
        run: sha256sum envctl-${{ steps.version.outputs.VERSION }}.tar.gz
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: envctl-${{ steps.version.outputs.VERSION }}.tar.gz
          generate_release_notes: true
