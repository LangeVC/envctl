name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Forgejo Actions: actions are pulled via fully-qualified GitHub URLs
# (instance DEFAULT_ACTIONS_URL is code.forgejo.org). Runner label
# ubuntu-latest → catthehacker act image. macOS leg dropped (no macOS
# runner on the self-hosted Forgejo runner; covered manually).
jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint bin/envctl
        run: shellcheck -S warning bin/envctl install.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Make executable
        run: chmod +x bin/envctl install.sh
      - name: Version check
        run: bin/envctl version
      - name: Help check
        run: bin/envctl help
      # NOTE: capture `envctl list` into a var before grepping. Piping it
      # directly (`list | grep -q`) makes grep close the pipe on first match,
      # SIGPIPE-killing envctl's remaining printf → exit 141, which fails the
      # step under `-eo pipefail`. GitHub's runner happened to flush in one
      # write and masked it; the self-hosted runner surfaces it deterministically.
      - name: Set, get, list
        run: |
          d=/tmp/envctl-test; mkdir -p "$d"
          ENVCTL_DIR=$d bin/envctl set ai TEST_KEY=hello123
          val="$(ENVCTL_DIR=$d bin/envctl get ai TEST_KEY)"; grep -q hello123 <<<"$val"
          out="$(ENVCTL_DIR=$d bin/envctl list)"; grep -q TEST_KEY <<<"$out"
      - name: Remove key
        run: |
          d=/tmp/envctl-test
          ENVCTL_DIR=$d bin/envctl rm ai TEST_KEY
          out="$(ENVCTL_DIR=$d bin/envctl list)"; ! grep -q TEST_KEY <<<"$out"
      - name: Multiple clusters
        run: |
          d=/tmp/envctl-test
          ENVCTL_DIR=$d bin/envctl set cloud AWS_KEY=fake-aws
          ENVCTL_DIR=$d bin/envctl set dev GITHUB_TOKEN=fake-gh
          out="$(ENVCTL_DIR=$d bin/envctl list)"
          grep -q AWS_KEY <<<"$out"
          grep -q GITHUB_TOKEN <<<"$out"
